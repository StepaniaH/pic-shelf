# Pic Shelf — Docker Compose
#
# First run:  mkdir -p data
#             docker compose run --rm picshelf picshelf init --admin admin
#             docker compose up -d
#
# Docs: docs/deployment.md (volumes / networking / permissions / backups)
services:
  picshelf:
    # Published image. To build from this checkout instead, replace both lines with:
    #   build: .
    #   image: pic-shelf:local
    image: stepaniah/pic-shelf:latest
    container_name: picshelf
    restart: unless-stopped
    ports:
      - "127.0.0.1:39431:39431"
    volumes:
      - ./data:/data                                # database / thumbnails / secret key
      # - /path/to/your/images:/libraries/photos:ro # image library, read-only is fine for index mode
    user: "1000:1000"                               # your own UID:GID — `id -u`, `id -g`
    environment:
      # UI language: zh / en. Unset follows the system locale.
      # PICSHELF_LANG: en
