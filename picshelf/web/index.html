<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="Pic Shelf — 图片库">Pic Shelf — 图片库</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<a href="#view" class="skip-link" data-i18n="跳到内容">跳到内容</a>
<header id="topbar">
  <a class="brand" href="#/home">Pic Shelf</a>
  <form id="search-form" role="search">
    <input id="search-input" type="search" autocomplete="off"
           aria-label="搜索图片" data-i18n-label="搜索图片"
           placeholder="搜索：tag / artist:名 / album:名 / rating:>=8 / fav: / ext:png"
           data-i18n-placeholder="搜索：tag / artist:名 / album:名 / rating:>=8 / fav: / ext:png">
  </form>
  <nav id="nav">
    <a href="#/home" data-i18n="首页">首页</a>
    <a href="#/albums" data-i18n="专辑">专辑</a>
    <a href="#/artists" data-i18n="艺术家">艺术家</a>
    <a href="#/tags" data-i18n="标签">标签</a>
    <a href="#/favorites" data-i18n="收藏">收藏</a>
    <a href="#/inbox" data-i18n="待整理">待整理</a>
    <a href="#/queries" data-i18n="保存的查询">保存的查询</a>
    <a href="#/batches" data-i18n="批次记录">批次记录</a>
    <a href="#/admin" id="nav-admin" hidden data-i18n="管理">管理</a>
  </nav>
  <div id="userbox"></div>
  <button class="btn small" id="lang-btn" type="button" title="语言 / Language"></button>
</header>
<main id="view" tabindex="-1" aria-live="polite"></main>
<div id="overlay-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
