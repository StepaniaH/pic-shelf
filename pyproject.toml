[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pic-shelf"
version = "0.0.1"
description = "Self-hosted image library: import, encode, search, tag, rate, artists, playback — Web / TUI / CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StepaniaH" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pillow>=10.4",
  "imagehash>=4.3",
  "numpy>=1.26",
  "scipy>=1.13",
  "click>=8.1",
  "textual>=0.80",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
picshelf = "picshelf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["picshelf"]
