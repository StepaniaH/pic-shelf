[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "pic-shelf"
version = "0.0.1"
description = "Self-hosted image library: import, encode, search, tag, rate, artists, playback — Web / TUI / CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StepaniaH" }]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2,<3",
  "uvicorn[standard]>=0.30",
  "pillow>=10.4",
  "imagehash>=4.3",
  "numpy>=1.26",
  "scipy>=1.13",
  "click>=8.1",
  "textual>=0.80",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "httpx2>=2.13.1"]
browser = ["playwright>=1.45"]

[project.scripts]
picshelf = "picshelf.cli:main"

[tool.pytest.ini_options]
markers = [
  "browser: isolated Chromium interface tests",
  "http: real loopback HTTP interface tests",
  "module_contract: JavaScript contracts requiring Node.js",
]

[tool.hatch.build.targets.wheel]
packages = ["picshelf"]

[tool.hatch.build.targets.sdist]
exclude = ["/AGENTS.md", "/TASKS.md", "/docs/decisions.md", "/docs/research", "/data", "/.uv-cache", "/.venv", "/.codex", "/.agents"]
