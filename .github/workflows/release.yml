name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ["TAG"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(version)}\].*?(?=^## |\Z)", text, re.M | re.S)
          if not m:
              m = re.search(r"^## \[Unreleased\].*?(?=^## |\Z)", text, re.M | re.S)
          notes = m.group(0).strip() if m else f"See CHANGELOG.md for {os.environ['TAG']}."
          notes = re.sub(rf"^## \[({re.escape(version)})\]", r"## \1", notes)
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
